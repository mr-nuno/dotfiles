# docker-compose.yml — local development stack: .NET API + SQL Server + Seq.
# See .claude/docs/ci-cd-docker.md. Config/secrets come from .env (copy env.example -> .env).
# Passwords are LOCAL DEV placeholders only — never used in production.
# Replace {Api} with your real project name.

services:
  api:
    build:
      context: .
      dockerfile: src/{Api}/Dockerfile
      args:
        VERSION: 1.0.0
    ports:
      - "5000:8080"
    env_file: .env
    environment:
      # Ship API logs to the Seq container over the compose network.
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    restart: on-failure

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:5341"   # ingestion
      - "8081:80"     # UI -> http://localhost:8081 (no login for local dev)
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq-data:/data

volumes:
  mssql-data:
  seq-data:
